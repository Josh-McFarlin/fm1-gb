# FM-GB (gb/): the emulator's firmware built with the pinned JieLi toolchain, its tests, and its install page: the
# package with no game in it (fm-gb.fwsc) beside the page that puts the player's own ROM into it and installs it. Every
# push: the package and the page as an artifact. A push to main: the page published on GitHub Pages (Settings, Pages,
# Source: GitHub Actions). No ROM is built in, fetched or published: the player brings one to the page.
name: fm-gb

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test FM-GB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Every action pinned to a commit (a tag can be moved), its version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive                 # felucca-bsp

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3

      - name: Python packages (uv.lock, hash-checked)
        run: uv sync --frozen --group extras

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .toolchain/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('tools/toolchain.lock') }}

      - name: The pinned toolchain, SDK files, Node
        run: tools/setup_toolchain.sh --only jieli,ac79-sdk,node

      - name: The firmware (no game in it)
        run: .venv/bin/python tools/build.py gb

      - name: Tests (the core, the app in the host simulator, the ROM packers)
        env:
          PYTHON: .venv/bin/python
        run: gb/tests/run.sh

      - name: The install page
        run: .venv/bin/python gb/tools/site.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: fm-gb
          path: gb/build/site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: gb/build/site/

  pages:
    name: Publish the install page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
